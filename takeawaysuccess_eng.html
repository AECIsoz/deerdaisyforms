<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Page in respons to the submission of a take away order to The Deer & Daisy."
    />
    <meta
      http-equiv="refresh"
      content="10; url =https://www.deerdaisyinn.com"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Open+Sans+Condensed:wght@300&family=Oswald:wght@200;400&family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./resources/favicon/favicon.ico"
      type="image/x-icon"
    />
    <script src="./components/header.js" type="text/javascript" async></script>
    <script src="./components/footer.js" type="text/javascript" defer></script>
    <title>Thanks for your order!</title>
  </head>
  <body>
    <!-- top navigation =========================================================-->
    <header>
      <header-component></header-component>
    </header>

    <!-- Main section ==========================================================-->
    <section>
      <div class="main-container">
        <article class="main-image tea-image">
          <div class="success-container">
            <div>
              <h3>Thanks for your order!</h3>
              <p>
                The order will be confirmed by email from info@deerdaisyinn.se.
              </p>
              <p>
                Sometimes the message ends up in the spam folder so please have
                a look in there. If you did't get a response within a day or so
                please get in touch because that means something has gone wrong!
              </p>
              <button class="btn">
                <a href="https://deerdaisyforms.netlify.app/"></a>Close
              </button>
            </div>
          </div>
        </article>
      </div>
    </section>
    <!-- footer ================================================================-->
    <footer>
      <footer-component></footer-component>
    </footer>
    <script
      src="https://kit.fontawesome.com/a101703e57.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
