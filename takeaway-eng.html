<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Detta är ett bokningsformulär för Take away tea från på The Deer & Daisy."
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Open+Sans+Condensed:wght@300&family=Oswald:wght@200;400&family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./resources/favicon/favicon.ico"
      type="image/x-icon"
    />
    <script src="./components/header.js" type="text/javascript" async></script>
    <script src="./components/footer.js" type="text/javascript" defer></script>
    <title>Take Away Tea order</title>
  </head>
  <body>
    <!-- top navigation =========================================================-->
    <header>
      <header-component></header-component>
    </header>

    <!-- Main section ==========================================================-->
    <section>
      <div class="main-container">
        <article class="main-image tea-image">
          <div class="form-container">
            <h2 class="tagline">Take away tea order</h2>
            <form
              name="takeaway_eng"
              method="POST"
              action="/takeawaysuccess_eng"
              netlify
            >
              <div class="form-field">
                <h3 for="datum">When would you like your order?</h3>
                <!-- inserting dates from js-->
                <select name="datum" id="datum">
                  <option value="pick-datum" default>Pick a date</option>
                </select>
              </div>
              <div class="form-field">
                <h3>How many?</h3>
                <input
                  type="text"
                  name="antal-free"
                  class="field-height"
                  size="4"
                />
              </div>
              <div class="form-field">
                <h3>Comments</h3>
                <p class="note">Let us know of any allergies.</p>
                <textarea name="upplysning" cols="42"></textarea>
              </div>
              <div class="form-field">
                <h3>Your name</h3>
                <input
                  type="text"
                  name="namn"
                  size="40"
                  class="field-height"
                  required
                />
              </div>
              <div class="form-field">
                <h3>Your email address</h3>
                <input
                  type="email"
                  name="epost"
                  size="40"
                  class="field-height"
                  required
                />
              </div>
              <div class="form-field">
                <h3>Your phone number</h3>
                <input
                  type="text"
                  name="telefon"
                  size="40"
                  class="field-height"
                  required
                />
              </div>
              <p>
                <button type="submit" class="btn">Send</button>
              </p>
            </form>
          </div>
        </article>
      </div>
    </section>
    <!-- footer ================================================================-->
    <footer>
      <footer-component></footer-component>
    </footer>
    <script
      src="https://kit.fontawesome.com/a101703e57.js"
      crossorigin="anonymous"
    ></script>
    <script src="main_eng.js"></script>
  </body>
</html>
